services:
  coolleaf-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coolleaf-app
    env_file:
      - .env
    environment:
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - default
      - share_default
    restart: always

  nginx:
    image: nginx:stable-alpine-perl
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - coolleaf-app

  cf-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    environment:
      - TUNNEL_TRANSPORT=http2
    command: tunnel --no-autoupdate run --protocol http2 --token eyJhIjoiOWU5MjE5MzgwODRjNzk4N2JkNGIwNDM1YTYyZjE2ODIiLCJ0IjoiODE1MmU1ZTgtYmQ2Yi00YjViLWE1OTctZTk0OGU3M2VmNmM4IiwicyI6Ik5Ua3lOVFEyT0dFdE4yWXpPUzAwTW1WaExXRXhORGt0WVdVNE16STVZemxrWkRObCJ9

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    restart: unless-stopped

networks:
  share_default:
    name: share_default
    external: true