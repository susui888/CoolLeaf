global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 采集 Node Exporter 指标
  - job_name: "node_exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # 采集 Spring Boot 应用指标
  - job_name: "CoolLeaf"
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: '/actuator/prometheus'